name: PR Preview - Build

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  build:
    uses: WordPress/action-wp-playground-pr-preview/.github/workflows/preview-build.yml@v4
    with:
      artifacts: webmcp-abilities=build/webmcp-abilities.zip
      build-command: |
        set -euo pipefail
        mkdir -p build/webmcp-abilities
        cp webmcp-abilities.php uninstall.php build/webmcp-abilities/
        cp -R includes dist build/webmcp-abilities/
        ( cd build && zip -qr webmcp-abilities.zip webmcp-abilities )
